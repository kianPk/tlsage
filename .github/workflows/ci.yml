name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: tlsage --version
      - name: smoke check github.com
        run: |
          tlsage github.com --warn-days 7 --json | python -c "import sys,json; d=json.load(sys.stdin); assert d['host']=='github.com'"
          tlsage github.com --warn-days 7
          test $? = 0
